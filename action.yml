name: "Next Version"
description: "Realiza el release basado en los commits y conventional commit"
inputs:
  github_token:
    description: Github Token
    required: true
  branches:
    description: Branches to release
    required: false
    default: '["main"]'
  only_version:
    description: Only version
    required: false
    default: 'true'
  # generado con la información de los inputs
  jira_release_name:
    description: "Title of the release name template. This will be used in name of publication in JIRA and followed by version. e.g. 'Test v${version}'"
    required: false
    default: ""
  jira_host_url:
    description: Jira Host URL
    required: false
    default: "https://andreani.atlassian.net"
  webhook_url_teams:
    description: "Webhook URL de Teams para notificaciones"
    required: false
    default: ""

outputs:
  new-version:
    description: The version of the release
    value: ${{ steps.next-version.outputs.newVersion }}
  previous-version:
    description: The previous version of the release
    value: ${{ steps.next-version.outputs.previousVersion }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Generate .npmrc file
      uses: architecture-it/actions@generate-npmrc
      with:
        npm_token: ${{ inputs.github_token }}
    - name: Write bash script
      shell: bash
      run: |
        echo '#!/bin/bash' >> version.sh
        echo 'echo "newVersion=$1" >> $GITHUB_OUTPUT' >> version.sh
        echo 'echo "previousVersion=$2" >> $GITHUB_OUTPUT' >> version.sh
        chmod +x version.sh
    - name: Get Optional plugins
      shell: bash
      id: get-optional-plugins
      run: |
        if [ "${{ inputs.webhook_url_teams }}" != "" ]; then
          echo "PLUGINS=',\n    [\"semantic-release-ms-teams\", { \"webhookUrl\": \"${{ inputs.webhook_url_teams }}\", \"title\": \"Una nueva versión está disponible\", \"showContributors\": true, \"notifyInDryRun\": ${RELEASED} }]'" >> $GITHUB_OUTPUT
        else
          echo "PLUGINS=''" >> $GITHUB_OUTPUT
        fi

    - name: Write config file for Release
      shell: bash
      run: |
        echo 'module.exports = {
          plugins: [
            [
              "@semantic-release/commit-analyzer", 
              {
                  releaseRules: [
                    { breaking: true, release: "major" },
                    { revert: true, release: "patch" },
                    { type: "feat", release: "minor" },
                    { type: "fix", release: "patch" },
                    { type: "perf", release: "patch" },
                    { emoji: ":racehorse:", release: "patch" },
                    { emoji: ":bug:", release: "patch" },
                    { emoji: ":penguin:", release: "patch" },
                    { emoji: ":apple:", release: "patch" },
                    { emoji: ":checkered_flag:", release: "patch" },
                    { tag: "BUGFIX", release: "patch" },
                    { tag: "FEATURE", release: "minor" },
                    { tag: "SECURITY", release: "patch" },
                    { tag: "Breaking", release: "major" },
                    { tag: "Fix", release: "patch" },
                    { tag: "Feat", release: "minor" },
                    { tag: "Update", release: "minor" },
                    { tag: "New", release: "minor" },
                    { component: "perf", release: "patch" },
                    { component: "deps", release: "patch" },
                    { type: "FEAT", release: "minor" },
                    { type: "FIX", release: "patch" },
                    { type: "ref", release: "patch" },
                    { type: "styles", release: "patch" }
                  ]
              }
            ],
            "@semantic-release/release-notes-generator",
            "@semantic-release/github",
            [
              "@semantic-release/exec",
              {
                verifyReleaseCmd: "./version.sh ${nextRelease.version} ${lastRelease.version}"
              }
            ],
            [
              "@architecture-it/semantic-release-jira",
              {
                "releaseName": "${{ inputs.jira_release_name }}",
                "jiraHost": "${{ inputs.jira_host_url }}",
                released: ${{ inputs.only_version != 'true' }},
                setReleaseDate: ${{ inputs.only_version != 'true' }}
              }
            ]${{ steps.get-optional-plugins.outputs.PLUGINS }}
          ],
          branches: ${{ inputs.branches }},
          dryRun: ${{ inputs.only_version == 'true' }}
        };' >> release.config.cjs

    - name: Write config file for Release to debug
      shell: bash
      run: cat release.config.cjs

    - name: Get the version
      run: npx --no-install -y -p semantic-release -p semantic-release-ms-teams -p @semantic-release/exec -p @semantic-release/git -p @semantic-release/github@10.0.0 -p @architecture-it/semantic-release-jira@beta -c semantic-release --legacy-peer-deps
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      id: next-version
      shell: bash
