name: SonarQube Analyzer
description: "Se realiza el análisis en sonarqube"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: false
    default: ''
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: false
    default: ''
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  sonar_url: 
    description: "url sonarqube"
    required: true
  sonar_token: 
    description: "token sonarqube"
    required: true
  sonar_code:
    description: "Lenguaje de programación: .Net, Java, Go, Python, Js "
    required: true
  skip_test: 
    description: "Omite el analisis de test"
    required: false
    default: 'false'
  version:
    description: "version de lenguaje, ej 3.7, 3.8..."
    required: false
    default: '3.8'
  sonar_custom:
    description: "config sonar custom"
    default: ""
    required: false
  tags:
    description: "extra tags, ej: 'react-18, microfrontend'"
    default: ""
    required: false
  project_base_dir:
    description: "Directory of the project"
    default: "."
    required: false
  custom_sonar_key:
    description: "Custom sonar key, if not provided it will be generated with the format organization_repository"
    default: ""
    required: false

runs:
  using: "composite"
  steps:
      - name: Key Repository
        shell: bash
        run: 'CI OK'

