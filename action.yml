name: "SonarQube Analyzer NET"
description: "Se realiza el análisis en sonarqube para NET"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  sonar_url: 
    description: "url sonarqube"
    required: true
  sonar_token: 
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  sonar_custom:
    decription: "config sonar custom"
    default: ""
runs:
  using: "composite"
  steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: | 
            2.1.x
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            10.0.x

      - name: Sonarqube Begin
        run: |
          dotnet nuget locals -c all
          dotnet nuget add source https://nuget.pkg.github.com/architecture-it/index.json --name architecture-it -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/operations-innovation/index.json --name operations-innovation -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/customer-experience/index.json --name customer-experience -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/warehouse-andreani/index.json --name warehouse-andreani -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/corporate-solutions-gla/index.json --name corporate-solutions-gla -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/GlobAllPack/index.json --name GlobAllPack -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
        shell: bash

      - name: Restore 
        run: dotnet restore
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Build
        run: dotnet build --no-incremental
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Test 
        env:
          ASPNETCORE_ENVIRONMENT: Development
        shell: bash
        run: dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover --results-directory TestResults/ --logger "trx;LogFileName=unittests.trx" --no-build --no-restore --configuration release 
        working-directory: ${{ inputs.workdir_test }}
        
