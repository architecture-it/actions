name: "Python CI"
description: "Realiza build, test y coverage para proyectos Python"
inputs:
  # Github
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: false
    default: 'github-actions[bot]'
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: false
    default: ''

  version:
    description: "Versión de Python, ej. 3.10, 3.11..."
    required: false
    default: 3.10

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.version }}

    - name: Configure Git auth for private repos
      run: |
        git config --global url."https://${{ inputs.github_token }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      shell: bash
      if: ${{ inputs.github_token != '' }}

    # (Opcional pero recomendado) Instala 'uv' de forma confiable
    - name: Set up uv (si se usa uv.lock)
      if: ${{ hashFiles('uv.lock') != '' }}
      uses: astral-sh/setup-uv@v3

    - name: Resolver e instalar dependencias (uv o pip)
      id: deps
      shell: bash
      run: |
        set -euo pipefail
        PKG_TOOL="none"

        if [[ -f "uv.lock" ]]; then
          echo "Detectado uv.lock → usando uv"
          PKG_TOOL="uv"
          # Crea/actualiza el entorno según pyproject/uv.lock
          uv sync
          # Asegura pytest y pytest-cov en el entorno
          uv pip install pytest pytest-cov
        elif [[ -f "requirements.txt" ]]; then
          echo "Detectado requirements.txt → usando pip"
          PKG_TOOL="pip"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
        else
          echo "No se detectaron archivos de dependencias (uv.lock o requirements.txt)."
        fi

        echo "pkg_tool=$PKG_TOOL" >> "$GITHUB_OUTPUT"

