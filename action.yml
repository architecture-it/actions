name: "🔧 Generate .npmrc"
description: "Genera el archivo de configuración para los paquetes"
inputs:
  npm_token:
    description: Github Token
    default: ""
    required: false
  font_awesome_key:
    description: Font Awesome key
    default: ""
    required: false
  add_pnpm_flags:
    description: Add defaults flags to pnpm works correctly
    default: "true"
    required: false
  working_directory:
    description: Working directory
    default: "./"
    required: false

runs:
  using: "composite"
  steps:
  - name: Add organization with possible pacakges
    run: |
      echo '@customer-experience:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@architecture-it:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@operations-innovation:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@witwot-jms:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@warehouse-andreani:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@globallpack:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@administracion-hop:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@infrastructure-services:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '@corporate-solutions-gla:registry=https://npm.pkg.github.com/' >> .npmrc
      echo '//npm.pkg.github.com/:_authToken=${{ inputs.npm_token }}' >> .npmrc
    shell: bash
    working-directory: ${{ inputs.working_directory }}
    if: ${{ inputs.npm_token != '' }}
  - name: Add and autenticate fontawesome registry
    run: |
      echo '@fortawesome:registry=https://npm.fontawesome.com/' >> .npmrc
      echo '//npm.fontawesome.com/:_authToken=${{ inputs.font_awesome_key }}' >> .npmrc
    shell: bash
    working-directory: ${{ inputs.working_directory }}
    if: ${{ inputs.font_awesome_key != '' }}
  - name: Add flags importants to pnpm
    if: ${{ inputs.add_pnpm_flags }}
    run: |
      echo 'auto-install-peers=true' >> .npmrc
      echo 'enable-pre-post-scripts=true' >> .npmrc
    shell: bash
    working-directory: ${{ inputs.working_directory }}
