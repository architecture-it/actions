name: "Sonar Analizer React Native"
description: "Realiza el análisis de sonarqube para React Native (Javascript/Typescript)"
inputs:
  sonar_url: 
    description: "url sonarqube"
    required: true
  sonar_token: 
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  skip_test:
    description: "permite skipear los procesos de testing"
    required: false
    default: 'false' 
runs:
  using: "composite"
  steps:
      - name: CI ok
        shell: bash
        run: 'echo OK'
