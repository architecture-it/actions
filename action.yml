name: 'Jira Automation Convention Checker'
description: 'Check if follows the convention for automation in JIRA.'
author: 'Antony Fagundez <afagundez@andreani.com>'
inputs:
  token:
    description: 'GitHub Access Token'
    required: false
    default: ${{ github.token }}
  jira_email:
    description: 'JIRA Email'
    required: true
  jira_api_token:
    description: 'JIRA API Token'
    required: true
  fix_title_if_not_valid:
    description: 'Automatically fix the PR title if it does not follow the JIRA convention.'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  color: red
  icon: search
