name: "Sonar Analizer Javascript/Typescript"
description: "Realiza el análisis de sonarqube para Javascript/Typescript"
inputs:
  sonar_url: 
    description: "url sonarqube"
    required: true
  sonar_token: 
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  skip_test:
    description: "permite skipear los procesos de testing"
    required: false
    default: 'false' 
  verbose:
    description: "The run of sonnarqube will be in verbose mode"
    required: false
    default: 'false'
  project_base_dir:
    description: "Directory of the project"
    default: "."
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "ACTION SONAR JS LOADED"
        exit 0
